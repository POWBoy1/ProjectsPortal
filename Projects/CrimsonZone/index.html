<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrimsonZone - Coming Soon</title>
    <meta name="description" content="CrimsonZone is coming soon. Stay tuned.">
    <meta property="og:title" content="CrimsonZone - Coming Soon">
    <meta property="og:description" content="CrimsonZone is coming soon. Stay tuned.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a0a0a;
            color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 30, 30, 0.25) 0%, transparent 70%);
            filter: blur(60px);
            animation: crimson-pulse 4s ease-in-out infinite, drift 12s ease-in-out infinite;
            z-index: 1;
        }
        .orb-1 { width: 500px; height: 500px; top: -10%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; bottom: -15%; right: -10%; animation-delay: 2s; }
        .orb-3 { width: 300px; height: 300px; top: 40%; left: 50%; animation-delay: 4s; }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(200, 30, 30, 0.6);
            animation: float-particle linear infinite;
            z-index: 1;
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(30, 5, 5, 0.6);
            border: 1px solid rgba(80, 20, 20, 0.3);
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            backdrop-filter: blur(4px);
            animation: card-glow 3s ease-in-out infinite;
        }

        .card h1 {
            font-size: 3.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #cc2020;
            margin-bottom: 12px;
            animation: glow-pulse 2.5s ease-in-out infinite;
        }

        .card p {
            font-size: 1.125rem;
            color: #999;
        }

        .card p strong {
            color: #f2f2f2;
        }

        .card .coming-soon {
            margin-top: 8px;
        }

        @keyframes crimson-pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(30px, -20px); }
            50% { transform: translate(-20px, 30px); }
            75% { transform: translate(20px, 20px); }
        }

        @keyframes float-particle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 10px #cc2020, 0 0 20px #cc2020, 0 0 40px rgba(200,30,30,0.5); }
            50% { text-shadow: 0 0 20px #cc2020, 0 0 40px #cc2020, 0 0 80px rgba(200,30,30,0.5); }
        }

        @keyframes card-glow {
            0%, 100% { box-shadow: 0 0 25px rgba(200,30,30,0.3), 0 0 50px rgba(200,30,30,0.1); }
            50% { box-shadow: 0 0 35px rgba(200,30,30,0.5), 0 0 70px rgba(200,30,30,0.2); }
        }
    </style>
</head>
<body>
    <img class="bg-image" src="crimson-trees.jpg" alt="">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="card">
        <h1>CrimsonZone</h1>
        <p><strong>Project: CrimsonZone</strong></p>
        <p class="coming-soon">Coming Soon...</p>
    </div>

    <script>
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (6 + Math.random() * 8) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            const size = (2 + Math.random() * 4) + 'px';
            p.style.width = size;
            p.style.height = size;
            document.body.appendChild(p);
        }
    </script>

</body>
</html>
